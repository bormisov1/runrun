name: Verify RUNRUN iOS native build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: '1'
      ENTERPRISE_REPOSITORY: https://repo.maven.apache.org/maven2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - name: Compile for iOS Simulator without signing
        run: |
          xcodebuild build \
            -workspace ios/RUNRUN.xcworkspace \
            -scheme RUNRUN \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
